services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sovereign_agent
      POSTGRES_USER: sovereign
      POSTGRES_PASSWORD: sovereign_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  layer1:
    build:
      context: .
      target: layer1
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://sovereign:sovereign_dev@postgres:5432/sovereign_agent
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      - postgres
      - redis

  layer3:
    build:
      context: .
      target: layer3
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://sovereign:sovereign_dev@postgres:5432/sovereign_agent
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      - postgres
      - redis

  behavioral-worker:
    build:
      context: .
      target: behavioral-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      - redis

volumes:
  pgdata:
